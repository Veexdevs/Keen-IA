# Keew IA — instaladores para Windows, Linux, Android e iOS.
#
# Um site não vira .exe nem .apk sozinho: esses arquivos só saem de uma máquina
# com o sistema certo (Windows para .exe, Linux para .AppImage/.deb, um Mac com
# Xcode para .ipa). Este workflow roda cada um no sistema que ele exige e
# anexa os arquivos a um GitHub Release.
#
# Rodar pela aba Actions → "Instaladores" → Run workflow. Os arquivos aparecem
# no Release "Keew IA — instaladores" (e ficam como artifact de cada execução).
#
# Sobre a assinatura: os binários saem sem assinatura de código. Windows mostra
# o aviso do SmartScreen e o macOS exige "Abrir mesmo assim" na primeira vez.
# Assinar exige certificado pago — está anotado no README, não escondido.
name: Instaladores

on:
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows: .exe (NSIS) e versão portátil ────────────────────────────────
  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Instalar dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Gerar .exe
        working-directory: desktop
        run: npm run pack:win
        env:
          # electron-builder não publica nada aqui; isto só evita que ele
          # tente procurar um token para publicar no GitHub
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: keew-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error

  # ── Linux: .AppImage e .deb ──────────────────────────────────────────────
  linux:
    name: Linux .AppImage / .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Instalar dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Gerar AppImage e .deb
        working-directory: desktop
        run: npm run pack:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: keew-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  # ── Android: .apk ────────────────────────────────────────────────────────
  android:
    name: Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Dependências
        run: npm install --no-audit --no-fund && npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 --no-audit --no-fund

      - name: Projeto Android
        run: |
          mkdir -p www && printf '<!doctype html><meta http-equiv="refresh" content="0;url=https://keew-ia.vercel.app">' > www/index.html
          npx cap add android
          npx cap sync android

      - name: Ícone do app
        working-directory: android
        run: |
          # the Android project ships a placeholder icon; put Keew's mark in
          cp ../public/icons/app-icon-1024.png ../resources/icon.png 2>/dev/null || true

      - name: Gerar .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/keew-ia-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: keew-android
          path: out/keew-ia-android.apk
          if-no-files-found: error

  # ── iOS: .ipa sem assinatura ─────────────────────────────────────────────
  ios:
    name: iOS .ipa (sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: npm install --no-audit --no-fund && npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/ios@6 --no-audit --no-fund

      - name: Projeto iOS
        run: |
          mkdir -p www && printf '<!doctype html><meta http-equiv="refresh" content="0;url=https://keew-ia.vercel.app">' > www/index.html
          npx cap add ios
          npx cap sync ios

      - name: Compilar (sem assinatura)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p out/Payload
          APP=$(find ios/App/build -name "App.app" -type d | head -1)
          cp -R "$APP" out/Payload/
          cd out && zip -qry keew-ia-ios.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: keew-ios
          path: out/keew-ia-ios.ipa
          if-no-files-found: error

  # ── um só lugar com tudo ────────────────────────────────────────────────
  release:
    name: Publicar
    needs: [windows, linux, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Listar o que foi gerado
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: installers
          name: Keew IA — instaladores
          body: |
            Baixe o arquivo do seu sistema:

            - **Android** — `keew-ia-android.apk` (instale permitindo "fontes desconhecidas")
            - **Windows** — `Keew IA Setup *.exe` (instalador) ou `Keew IA *.exe` (portátil)
            - **Linux** — `*.AppImage` (dá `chmod +x` e roda) ou `*.deb` (`sudo dpkg -i`)
            - **iOS** — `keew-ia-ios.ipa` (sem assinatura: precisa de sideload com AltStore/Sideloadly)

            Nenhum destes arquivos é assinado com certificado pago. O Windows vai
            avisar no SmartScreen e o macOS exige "Abrir mesmo assim" na primeira vez.
            Os apps carregam o site, então atualizam junto com ele.
          files: dist/*
          fail_on_unmatched_files: false
