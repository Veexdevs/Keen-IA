# Keew IA — manter o site acordado.
#
# Nesta etapa o produto é uma tela de chat, sem automações. O único job é
# impedir que a função durma por inatividade.
name: keew-keep-alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keew-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o site
        env:
          BASE: ${{ secrets.KEEW_BASE_URL }}
        run: |
          URL="${BASE:-https://keew-ia.vercel.app}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL/" || true)
          echo "GET $URL/ → $code"
          test "$code" = "200"
