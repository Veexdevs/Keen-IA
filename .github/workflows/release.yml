# Keew IA — builds de desktop e mobile.
#
# Nesta etapa o produto é uma tela de chat e a pasta apps/ foi removida de
# propósito, junto com o resto da interface antiga. Este workflow fica
# desativado até os apps voltarem (ver a tag backup-ui-completa).
name: release

on:
  workflow_dispatch:

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Os apps (.apk/.ipa/.exe) voltam depois que a interface estiver fechada."
